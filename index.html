            transition: font-stretch 0.3s ease-out, letter-spacing 0.3s ease-out;

        }
        /* Stretch navigation buttons */
        nav button, #tab-contact, #tab-contact-mobile {
            font-stretch: 180%;
            letter-spacing: 0.2em;
        }
        /* Keep header above all images */

    <script>
        const MAINTENANCE = {
            gallery: false,
            weblog: false,
            shop: false,
            contact: false
        };
        const MAINTENANCE_PASSWORD = "w59n1";

        let zoomLevel = 4;
        const zoomLevels = [1, 2, 3, 4];
        let galleryUnlocked = false;
        let draggedElement = null;
        let offsetX = 0;
        let offsetY = 0;
        let hasSeenTutorial = false;
        let originalPositions = new Map();

        // Store original grid positions
        function storeOriginalPositions() {
            const galleryItems = document.querySelectorAll('#gallery-grid > div');
            galleryItems.forEach((item, index) => {
                if (!originalPositions.has(item)) {
                    const rect = item.getBoundingClientRect();
                    const parentRect = item.parentElement.getBoundingClientRect();
                    const container = item.querySelector('.aspect-square');
                    const containerRect = container.getBoundingClientRect();
                    
                    originalPositions.set(item, {
                        left: rect.left - parentRect.left,
                        top: rect.top - parentRect.top,
                        width: rect.width,
                        height: containerRect.height,
                        index: index
                    });
                }
            });
        }

        // Toggle lock/unlock mode
        function toggleLock() {
            galleryUnlocked = !galleryUnlocked;
            const section = document.getElementById('gallery-section');
            const lockBtn = document.getElementById('lock-btn');
            const lockBtnMobile = document.getElementById('lock-btn-mobile');
            
            if (galleryUnlocked) {
                section.classList.add('gallery-unlocked');
                if (lockBtn) lockBtn.textContent = '🔓';
                if (lockBtnMobile) lockBtnMobile.textContent = '🔓';
                
                storeOriginalPositions();
                initializeUnlockedMode();
                
                // Show tutorial on first unlock
                if (!hasSeenTutorial) {
                    showTutorial();
                    hasSeenTutorial = true;
                }
            } else {
                section.classList.remove('gallery-unlocked');
                if (lockBtn) lockBtn.textContent = '🔒';
                if (lockBtnMobile) lockBtnMobile.textContent = '🔒';
                
                // Keep positions but restore click handlers
                restoreClickHandlers();
            }
        }

        // Show tutorial popup
        function showTutorial() {
            const tutorial = document.getElementById('unlock-tutorial');
            tutorial.classList.remove('hidden');
            
            // Auto-hide after 10 seconds
            const hideTimeout = setTimeout(() => {
                tutorial.classList.add('hidden');
            }, 10000);
            
            // Hide on click
            const hideOnClick = () => {
                clearTimeout(hideTimeout);
                tutorial.classList.add('hidden');
                document.removeEventListener('click', hideOnClick);
            };
            
            setTimeout(() => {
                document.addEventListener('click', hideOnClick);
            }, 100);
        }

        // Initialize unlocked mode
        function initializeUnlockedMode() {
            const galleryItems = document.querySelectorAll('#gallery-grid > div');
            galleryItems.forEach((item) => {
                // Only position if not already positioned
                if (!item.classList.contains('positioned')) {
                    const original = originalPositions.get(item);
                    if (original) {
                        item.style.position = 'absolute';
                        item.style.left = original.left + 'px';
                        item.style.top = original.top + 'px';
                        item.style.width = original.width + 'px';
                        
                        const container = item.querySelector('.aspect-square');
                        container.style.width = original.width + 'px';
                        container.style.height = original.height + 'px';
                        
                        item.classList.add('positioned');
                    }
                }
                
                // Remove lightbox click
                item.onclick = null;
                
                // Add drag handlers
                item.addEventListener('mousedown', startDrag);
                item.addEventListener('touchstart', startDrag);
            });
        }

        // Restore click handlers when locked
        function restoreClickHandlers() {
            const galleryItems = document.querySelectorAll('#gallery-grid > div');
            galleryItems.forEach((item, index) => {
                const imageData = images[index];
                if (imageData) {
                    item.onclick = () => openLightbox(imageData.url, imageData.title, imageData.description, imageData.alt);
                }
            });
        }

        // Reset all positions to original
        function resetPositions() {
            const galleryItems = document.querySelectorAll('#gallery-grid > div');
            galleryItems.forEach((item) => {
                const original = originalPositions.get(item);
                if (original) {
                    item.style.left = original.left + 'px';
                    item.style.top = original.top + 'px';
                    item.style.width = original.width + 'px';
                    
                    const container = item.querySelector('.aspect-square');
                    container.style.width = original.width + 'px';
                    container.style.height = original.height + 'px';
                }
            });
        }

        // Drag functionality - ultra-optimized for smooth performance
        let rafId = null;
        let currentX = 0;
        let currentY = 0;

        function startDrag(e) {
            if (!galleryUnlocked) return;
            
            // Prevent default behaviors
            e.preventDefault();
            e.stopPropagation();
            
            draggedElement = e.currentTarget;
            draggedElement.classList.add('dragging');
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const rect = draggedElement.getBoundingClientRect();
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
            
            // Store initial position
            currentX = clientX - offsetX;
            currentY = clientY - offsetY;
            
            // Use passive: false for immediate response
            document.addEventListener('mousemove', onDragMove, false);
            document.addEventListener('touchmove', onDragMove, false);
            document.addEventListener('mouseup', stopDrag, false);
            document.addEventListener('touchend', stopDrag, false);
        }

        function onDragMove(e) {
            if (!draggedElement) return;
            
            e.preventDefault();
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            currentX = clientX - offsetX;
            currentY = clientY - offsetY;
            
            // Cancel previous frame if still pending
            if (rafId) {
                cancelAnimationFrame(rafId);
            }
            
            // Schedule update for next frame
            rafId = requestAnimationFrame(updatePosition);
        }

        function updatePosition() {
            if (draggedElement) {
                draggedElement.style.left = currentX + 'px';
                draggedElement.style.top = currentY + 'px';
            }
            rafId = null;
        }

        function stopDrag(e) {
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
                
                // Final position update
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    updatePosition();
                }
                
                draggedElement = null;
            }
            
            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('touchmove', onDragMove);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        function showSection(section) {
            if (MAINTENANCE[section]) {
                const entered = prompt(`${section.charAt(0).toUpperCase() + section.slice(1)} is under maintenance. Enter password:`);
                if (entered !== MAINTENANCE_PASSWORD) {
                    alert('Access denied. This page is temporarily unavailable.');
                    return;
                }
            }
            
            try {
                localStorage.setItem('currentSection', section);
            } catch (e) {
                // Ignore localStorage errors (e.g., in file:// protocol or private browsing)
            }
            
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.remove('tab-active'));
            
            document.getElementById(section + '-section').classList.add('active');
            
            // Update both desktop and mobile tabs
            const desktopTab = document.getElementById('tab-' + section);
            const mobileTab = document.getElementById('tab-' + section + '-mobile');
            if (desktopTab) desktopTab.classList.add('tab-active');
            if (mobileTab) mobileTab.classList.add('tab-active');
            
            // Handle gallery controls visibility
            const controlsDesktop = document.getElementById('gallery-controls');
            const controlsMobile = document.getElementById('gallery-controls-mobile');
            if (section === 'gallery') {
                if (controlsDesktop) controlsDesktop.style.display = 'flex';
                if (controlsMobile) controlsMobile.style.display = 'flex';
            } else {
                if (controlsDesktop) controlsDesktop.style.display = 'none';
                if (controlsMobile) controlsMobile.style.display = 'none';
            }

            // Update page title based on section
            const titles = {
                gallery: 'Gallery - w59n1.com',
                weblog: 'Weblog - w59n1.com',
                shop: 'Shop - w59n1.com',
                contact: 'Contact - w59n1.com'
            };
            document.title = titles[section] || 'w59n1.com';

            // Lazy load images when switching to sections
            if (section === 'weblog') {
                lazyLoadBlogImages();
            }

            // Update URL without page reload (for better UX and analytics)
            try {
                if (history.pushState) {
                    const url = section === 'gallery' ? '/' : `/#${section}`;
                    history.pushState({section: section}, '', url);
                }
            } catch (e) {
                // Ignore history errors (e.g., in file:// protocol)
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('menu');
            const overlay = document.getElementById('overlay');
            
            if (menu.classList.contains('-translate-x-full')) {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.style.opacity = '1', 10);
            } else {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.classList.add('hidden'), 500);
            }
            
            menu.classList.toggle('-translate-x-full');
        }

        function zoomIn() {
            const currentIndex = zoomLevels.indexOf(zoomLevel);
            if (currentIndex > 0) {
                zoomLevel = zoomLevels[currentIndex - 1];
                updateGalleryGrid();
            }
        }

        function zoomOut() {
            const currentIndex = zoomLevels.indexOf(zoomLevel);
            if (currentIndex < zoomLevels.length - 1) {
                zoomLevel = zoomLevels[currentIndex + 1];
                updateGalleryGrid();
            }
        }

        function updateGalleryGrid() {
            const gallery = document.getElementById('gallery-grid');
            const gridClasses = {
                1: 'grid-cols-1',
                2: 'grid-cols-2',
                3: 'grid-cols-3',
                4: 'grid-cols-4'
            };
            
            gallery.className = `grid gap-4 md:gap-8 ${gridClasses[zoomLevel]}`;
        }

        // Image data with SEO-friendly alt text
        const images = [
            { id: 1, url: 'images/NYAN.jpg', title: 'Nyan', description: 'Nyan\n1417x1417\n01/13/2026', alt: 'Nyan' },
            { id: 2, url: 'images/makeitcount.jpg', title: 'Make it Count', description: 'Make it Count\n1417x1417\n01/10/2026', alt: 'Make it Count' },
            { id: 3, url: 'images/TRASHWORLD.jpg', title: 'My Trash World', description: 'My Trash World\n1417x1417\n01/07/2026', alt: 'My Trash World' },
            { id: 4, url: 'images/overtoolate.jpg', title: 'Over Too Late', description: 'Over Too Late\n1417x1417\n01/07/2026', alt: 'Over Too Late' },
            { id: 5, url: 'images/vivalapsycho.jpg', title: 'Viva La Psycho', description: 'Viva La Psycho\n1417x1417\n01/03/2026', alt: 'Viva La Psycho' },
            { id: 6, url: 'images/MONSTERBEAST_FINAL.jpg', title: 'Beast', description: 'Beast\nFeatured on @welcome.jpg Instagram page\n1417x1417\n12/24/2025', alt: 'Beast' },
            { id: 7, url: 'images/HOLYMASK.jpg', title: 'Holy Mask', description: 'The Holy Mask\n1417x1417\n12/21/2025', alt: 'The Holy Mask' },
            { id: 8, url: 'images/FREACKY.jpg', title: 'Freacky', description: 'Freacky\n1417x1417\n12/21/2025', alt: 'Freacky' },
            { id: 9, url: 'images/FUCKTHIS.jpg', title: 'Fuck This', description: 'Fuck This\n1417x1417\n12/20/2025', alt: 'Fuck This' },
            { id: 10, url: 'images/PEACLY.jpg', title: 'Peace', description: 'Peace\n1417x1417\n12/15/2025', alt: 'Peace' },
            { id: 11, url: 'images/acidtea.jpg', title: 'Acid Tea', description: 'Acid Tea - Digital art', alt: 'Acid Tea' },
            { id: 12, url: 'images/mirror.jpg', title: 'Mirror', description: 'Mirror - Digital artwork', alt: 'Mirror' },
            { id: 13, url: 'images/waifu.jpg', title: 'Waifu', description: 'Waifu - Digital art', alt: 'Waifu' },
            { id: 14, url: 'images/VENDING.jpg', title: 'Worthless Vending', description: 'Worthless Vending\n1417x1417\n11/27/2025', alt: 'Worthless Vending' }
        ];

        const blogPosts = [
            {
                date: '01/17/2026',
                title: 'Physical Image 1',
                content: 'Layered paper and prints, glue and different tape textures, coated with several layers of clear matte finish, fastened to cardboard backing for structure.',
                media: [
                    { type: 'image', url: 'images/art1front.png', alt: 'Physical artwork front' },
                    { type: 'image', url: 'images/art1back.png', alt: 'Physical artwork back' },
                ]
            },
            {
                date: '01/17/2026',
                title: 'Random stuff',
                content: 'Prints/outline on paper',
                media: [
                    { type: 'image', url: 'images/PRINT1.png', alt: 'Art print 1' },
                    { type: 'image', url: 'images/PRINT2.png', alt: 'Art print 2' },
                    { type: 'image', url: 'images/PRINT3.png', alt: 'Art print 3' },
                ]
            },
            {
                date: '01/17/2026',
                title: 'Website launch',
                content: 'w59n1.com should be up and running. No issues so far. I will be adding a lot more features in the next few weeks.',
                media: []
            },
            {
                date: '01/16/2026',
                title: 'testing',
                content: 'Getting w59n1.com setup. Issues with DNS shit, should be up and easily accessible sooner than later.',
                media: []
            }
        ];

        // Intersection Observer for lazy loading
        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const src = img.getAttribute('data-src');
                    if (src) {
                        img.src = src;
                        img.removeAttribute('data-src');
                        img.onload = () => {
                            img.classList.add('loaded');
                            img.parentElement.classList.remove('image-loading');
                        };
                    }
                    observer.unobserve(img);
                }
            });
        }, {
            rootMargin: '50px'
        });

        // Initialize gallery with lazy loading and SEO-friendly markup
        const gallery = document.getElementById('gallery-grid');
        updateGalleryGrid();
        
        images.forEach((image, index) => {
            const div = document.createElement('div');
            div.className = 'cursor-pointer';
            div.setAttribute('role', 'listitem');
            div.innerHTML = `
                <div class="aspect-square overflow-hidden bg-gray-50 image-loading">
                    <img data-src="${image.url}" 
                         alt="${image.alt}" 
                         title="${image.title}"
                         class="w-full h-full object-cover"
                         ${index < 4 ? '' : 'loading="lazy"'}>
                </div>
            `;
            div.onclick = () => openLightbox(image.url, image.title, image.description, image.alt);
            gallery.appendChild(div);
            
            const img = div.querySelector('img');
            imageObserver.observe(img);
        });

        // Lazy load blog images
        function lazyLoadBlogImages() {
            const blogImages = document.querySelectorAll('#blog-posts img[data-src]');
            blogImages.forEach(img => {
                imageObserver.observe(img);
            });
        }

        // Initialize blog posts with semantic HTML and SEO-friendly markup
        const blogContainer = document.getElementById('blog-posts');
        blogPosts.forEach(post => {
            const article = document.createElement('article');
            article.className = 'pb-8';
            article.setAttribute('itemscope', '');
            article.setAttribute('itemtype', 'https://schema.org/BlogPosting');
            
            let mediaHTML = '';
            if (post.media && post.media.length > 0) {
                mediaHTML = '<div class="space-y-4 mt-4">';
                post.media.forEach(item => {
                    if (item.type === 'image') {
                        mediaHTML += `<div class="image-loading"><img data-src="${item.url}" alt="${item.alt || post.title}" class="w-full h-auto object-cover rounded" loading="lazy"></div>`;
                    } else if (item.type === 'video') {
                        mediaHTML += `<video controls class="w-full h-auto rounded" preload="metadata"><source src="${item.url}" type="video/mp4"></video>`;
                    }
                });
                mediaHTML += '</div>';
            }
            
            article.innerHTML = `
                <time datetime="${post.date}" class="text-sm text-black mb-4 block" itemprop="datePublished">${post.date}</time>
                <h2 class="text-sm text-black font-normal mb-4" itemprop="headline">${post.title}</h2>
                <div class="text-sm text-black leading-relaxed whitespace-pre-wrap" itemprop="articleBody">${post.content}</div>
                ${mediaHTML}
            `;
            blogContainer.appendChild(article);
        });

        function openLightbox(url, title, description, alt) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightbox-image');
            const lightboxDescription = document.getElementById('lightbox-description');
            lightboxImage.src = url;
            lightboxImage.alt = alt || title;
            
            if (description) {
                const lines = description.split('\n').filter(line => line.trim());
                lightboxDescription.innerHTML = lines.map(line => 
                    `<div>${line.trim()}</div>`
                ).join('');
            } else {
                lightboxDescription.innerHTML = '';
            }
            
            lightbox.classList.remove('hidden');
            setTimeout(() => lightbox.classList.add('show'), 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('show');
            setTimeout(() => lightbox.classList.add('hidden'), 400);
        }

        // Shop products array
        const shopProducts = [];

        // Render shop products
        const shopContainer = document.getElementById('shop-items');
        shopProducts.forEach(product => {
            const productDiv = document.createElement('div');
            productDiv.className = 'group cursor-pointer';
            productDiv.setAttribute('itemscope', '');
            productDiv.setAttribute('itemtype', 'https://schema.org/Product');
            productDiv.innerHTML = `
                <div class="aspect-square overflow-hidden bg-gray-50 mb-3 image-loading">
                    <img data-src="${product.image}" 
                         alt="${product.name}" 
                         itemprop="image"
                         class="w-full h-full object-cover group-hover:opacity-90 transition-opacity duration-300"
                         loading="lazy">
                </div>
                <div class="text-sm mb-1" itemprop="name">${product.name}</div>
                <div class="text-sm text-gray-600" itemprop="offers" itemscope itemtype="https://schema.org/Offer">
                    <span itemprop="price">$${product.price.toFixed(2)}</span>
                    <meta itemprop="priceCurrency" content="USD">
                </div>
                ${product.inStock ? '' : '<div class="text-sm text-gray-400 mt-1">Sold Out</div>'}
            `;
            productDiv.onclick = () => {
                alert(`Product details for: ${product.name}\n\nThis will be integrated with ecommerce platform.`);
            };
            shopContainer.appendChild(productDiv);
            
            const img = productDiv.querySelector('img');
            if (img) {
                imageObserver.observe(img);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            
            if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) {
                closeLightbox();
            }
        });

        // Handle browser back/forward buttons
        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.section) {
                showSection(event.state.section);
            } else {
                const hash = window.location.hash.replace('#', '');
                if (hash && ['gallery', 'weblog', 'shop', 'contact'].includes(hash)) {
                    showSection(hash);
                } else {
                    showSection('gallery');
                }
            }
        });

        // Load last viewed section or hash on page load
        window.addEventListener('load', function() {
            const hash = window.location.hash.replace('#', '');
            if (hash && ['gallery', 'weblog', 'shop', 'contact'].includes(hash)) {
                showSection(hash);
            } else {
                try {
                    const lastSection = localStorage.getItem('currentSection');
                    if (lastSection && lastSection !== 'gallery') {
                        showSection(lastSection);
                    }
                } catch (e) {
                    // Ignore localStorage errors
                }
            }
        });

        // Preload critical images
        window.addEventListener('load', function() {
            const firstImages = Array.from(gallery.querySelectorAll('img')).slice(0, 4);
            firstImages.forEach(img => {
                const src = img.getAttribute('data-src');
                if (src) {
                    img.src = src;
                    img.removeAttribute('data-src');
                    img.classList.add('loaded');
                    img.parentElement.classList.remove('image-loading');
                }
            });
        });
    </script>
</body>
